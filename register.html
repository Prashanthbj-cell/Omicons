<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - OMICONS</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="login-container">

    <h1>OMICONS</h1>
    <h2>Create Account</h2>

    <form onsubmit="register(event)">

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="email" id="regEmail" placeholder="Email Address" required>

        <input type="password" id="regPassword" placeholder="Password" required>

        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit">Register</button>

    </form>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script src="assets/css/js/script.js"></script>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyCRD684PyMukUI1GS7loAFRCZ5mmDBJmDE",

  authDomain: "omicons.firebaseapp.com",

  projectId: "omicons",

  storageBucket: "omicons.firebasestorage.app",

  messagingSenderId: "720025359555",

  appId: "1:720025359555:web:b9fdcd4c30e9bcffddbe76"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.register = async function(event){

    event.preventDefault();

    const email = document.getElementById("regEmail").value;

    const password = document.getElementById("regPassword").value;

    const confirm = document.getElementById("confirmPassword").value;

    if(password !== confirm){

        alert("Passwords do not match.");

        return;

    }

    try{

        const userCredential = await createUserWithEmailAndPassword(auth, email, password);

await updateProfile(userCredential.user, {
    displayName: document.getElementById("name").value
});

        alert("Registration Successful!");

        window.location.href="login.html";

    }

   catch (error) {

    if (error.code === "auth/email-already-in-use") {

        alert("An account with this email already exists.");

    } else if (error.code === "auth/weak-password") {

        alert("Password must be at least 6 characters long.");

    } else if (error.code === "auth/invalid-email") {

        alert("Please enter a valid email address.");

    } else if (error.code === "auth/network-request-failed") {

        alert("Network error. Please check your internet connection.");

    } else {

        alert("Registration failed. Please try again.");

    }

};   // <-- This closes window.register

</script>

</body>
</html>
