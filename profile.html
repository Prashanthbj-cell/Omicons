<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile</title>

<link rel="stylesheet" href="assets/css/style.css">
</head>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {
    getAuth,
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRD684PyMukUI1GS7loAFRCZ5mmDBJmDE",
  authDomain: "omicons.firebaseapp.com",
  projectId: "omicons",
  storageBucket: "omicons.firebasestorage.app",
  messagingSenderId: "720025359555",
  appId: "1:720025359555:web:b9fdcd4c30e9bcffddbe76"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
    const storage = getStorage(app);

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    document.getElementById("userName").innerText =
        user.displayName || "OMICONS User";

    document.getElementById("userEmail").innerText =
        user.email;

    document.getElementById("userUID").innerText =
        user.uid;

    const joined = new Date(user.metadata.creationTime);

    document.getElementById("memberSince").innerText =
        joined.toDateString();

});

window.logout = async function () {

    await signOut(auth);
    window.location.href = "login.html";

};

</script>
<body>

<nav>

<div class="logo">
    <a href="index.html">OMICONS</a>
</div>

<div class="nav-actions">
    <button onclick="logout()">Logout</button>
</div>

</nav>

<div class="profile-container">

<h1>My Profile</h1>

<div class="profile-card">

<img src="assets/images/avatar.png" 
id="profileImage"
class="profile-img">


<input type="file" id="imageUpload" accept="image/*">


<button class="profile-btn" onclick="uploadImage()">
Upload Profile Image
</button>
     

<h2 id="userName">Loading...</h2>

<p id="userEmail"></p>

<p>
    <strong>Member Since:</strong>
    <span id="memberSince">Loading...</span>
</p>

<p>
    <strong>User ID:</strong>
    <span id="userUID"></span>
</p>

<hr>

<button class="profile-btn"
onclick="window.location.href='edit-profile.html'">
    Edit Profile
</button>

<button class="profile-btn"
onclick="logout()">
Logout
</button>

</div>

</div>
